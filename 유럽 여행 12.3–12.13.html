<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>유럽 여행 12.3–12.13</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#15202e;--mute:#5d6b7c;--line:#dde3ea;--bar:rgba(242,244,247,.9);--p:#3a62b0;--f:#b23a4e;--t:#66801f;--r:#a86f10;--s:#167b7b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1620;--card:#18212d;--ink:#eaf0f6;--mute:#9aa8b8;--line:#263344;--bar:rgba(15,22,32,.9)}}
:root[data-theme="dark"]{--bg:#0f1620;--card:#18212d;--ink:#eaf0f6;--mute:#9aa8b8;--line:#263344;--bar:rgba(15,22,32,.9)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent;word-break:keep-all}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:20}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 32px}
a{color:inherit;text-decoration:none}
h1{font-size:42px;line-height:1.12;letter-spacing:-.03em;font-weight:800;margin:28px 0 10px}
.date{font-size:18px;color:var(--mute);margin:0 0 26px}
.rt{display:flex;gap:6px;margin-bottom:8px}
.rt div{min-width:0}
.rt i{display:block;height:10px;border-radius:5px;background:var(--c);margin-bottom:8px}
.rt b{display:block;font-size:16px}
.rt small,.mute{color:var(--mute);font-size:13px}
.menu{margin:28px 0 20px;display:grid;gap:10px}
.m{display:flex;align-items:center;gap:12px;min-height:72px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.m:active{transform:scale(.985)}
.m div{flex:1}
.m b{display:block;font-size:18px}
.m span{font-size:14px;color:var(--mute)}
.m em{font-style:normal;font-size:26px;color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin:8px 2px 0}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd .row{max-width:560px;margin:0 auto;display:flex;align-items:center;padding:4px 8px 0;min-height:48px}
.bk{display:flex;align-items:center;min-height:44px;padding:0 10px;font-size:17px;color:var(--p);font-weight:600}
.hd h2{margin:0 0 0 4px;font-size:18px;font-weight:700}
.chips{max-width:560px;margin:0 auto;display:flex;gap:8px;padding:6px 16px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.c{flex:none;min-height:40px;padding:0 15px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.c.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:700}
.g{margin:22px 0 10px}
.g h3{display:flex;align-items:center;gap:8px;margin:0;font-size:20px}
.g h3::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.g p{margin:2px 0 0 20px;font-size:14px;color:var(--mute)}
.it{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.it h4{margin:0;font-size:17px;line-height:1.4}
.it p{margin:4px 0 0;font-size:15px;color:var(--mute);line-height:1.55}
.it .s{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:10px;background:var(--line);margin-bottom:6px}
.tl .it{display:grid;grid-template-columns:3.6em 1fr;column-gap:10px}
.tl .it .s{background:none;padding:0;margin:2px 0 0;font-size:14px;color:var(--mute)}
</style>
</head>
